<!doctype html>
<meta charset="utf-8">
<title>Contact sheet — dashclaw / LaunchVideo</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;background:#0d0f12;color:#e6e8eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  header{padding:20px 24px;border-bottom:1px solid #262b31;}
  header h1{margin:0;font-size:16px;font-weight:650;}
  header .sub{color:#8a929b;font-size:13px;margin-top:4px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:24px;max-width:1600px;margin:0 auto;}
  figure{margin:0;background:#14171b;border:1px solid #262b31;border-radius:10px;overflow:hidden;}
  figure img{display:block;width:100%;height:auto;background:#0a0c0e;}
  figcaption{display:flex;justify-content:space-between;padding:8px 12px;font-size:12px;color:#c9d1d9;border-top:1px solid #21262c;}
  figcaption .label{font-weight:600;}
  figcaption .frame{color:#7fb2ff;font-variant-numeric:tabular-nums;}
</style>
<header>
  <h1>Contact sheet · dashclaw / LaunchVideo</h1>
  <div class="sub">6 stills · props: props/dashclaw-launch.json</div>
</header>
<main class="grid">
    <figure>
      <img src="LaunchVideo-logo.png" alt="logo (frame 20)" loading="lazy">
      <figcaption><span class="label">logo</span><span class="frame">frame 20</span></figcaption>
    </figure>
    <figure>
      <img src="LaunchVideo-hook.png" alt="hook (frame 170)" loading="lazy">
      <figcaption><span class="label">hook</span><span class="frame">frame 170</span></figcaption>
    </figure>
    <figure>
      <img src="LaunchVideo-demo.png" alt="demo (frame 356)" loading="lazy">

    </figure>
    <figure>
      <img src="LaunchVideo-feature-1.png" alt="feature-1 (frame 1170)" loading="lazy">

    </figure>
    <figure>
      <img src="LaunchVideo-feature-2.png" alt="feature-2 (frame 1350)" loading="lazy">
      <figcaption><span class="label">feature-2</span><span class="frame">frame 1350</span></figcaption>
    </figure>
    <figure>
      <img src="LaunchVideo-end.png" alt="end (frame 1530)" loading="lazy">

    </figure>
</main>
