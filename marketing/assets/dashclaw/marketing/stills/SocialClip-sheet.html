<!doctype html>
<meta charset="utf-8">
<title>Contact sheet — dashclaw / SocialClip</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;background:#0d0f12;color:#e6e8eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  header{padding:20px 24px;border-bottom:1px solid #262b31;}
  header h1{margin:0;font-size:16px;font-weight:650;}
  header .sub{color:#8a929b;font-size:13px;margin-top:4px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:24px;max-width:1600px;margin:0 auto;}
  figure{margin:0;background:#14171b;border:1px solid #262b31;border-radius:10px;overflow:hidden;}
  figure img{display:block;width:100%;height:auto;background:#0a0c0e;}
  figcaption{display:flex;justify-content:space-between;padding:8px 12px;font-size:12px;color:#c9d1d9;border-top:1px solid #21262c;}
  figcaption .label{font-weight:600;}
  figcaption .frame{color:#7fb2ff;font-variant-numeric:tabular-nums;}
</style>
<header>
  <h1>Contact sheet · dashclaw / SocialClip</h1>
  <div class="sub">5 stills · props: props/dashclaw-social-vertical.json</div>
</header>
<main class="grid">
    <figure>
      <img src="SocialClip-f0.png" alt="f0 (frame 0)" loading="lazy">
      <figcaption><span class="label">f0</span><span class="frame">frame 0</span></figcaption>
    </figure>
    <figure>
      <img src="SocialClip-f75.png" alt="f75 (frame 75)" loading="lazy">
      <figcaption><span class="label">f75</span><span class="frame">frame 75</span></figcaption>
    </figure>
    <figure>
      <img src="SocialClip-f150.png" alt="f150 (frame 150)" loading="lazy">
      <figcaption><span class="label">f150</span><span class="frame">frame 150</span></figcaption>
    </figure>
    <figure>
      <img src="SocialClip-f224.png" alt="f224 (frame 224)" loading="lazy">
      <figcaption><span class="label">f224</span><span class="frame">frame 224</span></figcaption>
    </figure>
    <figure>
      <img src="SocialClip-f299.png" alt="f299 (frame 299)" loading="lazy">
      <figcaption><span class="label">f299</span><span class="frame">frame 299</span></figcaption>
    </figure>
</main>
